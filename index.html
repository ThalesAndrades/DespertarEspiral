<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Security headers vivem no .htaccess (public/.htaccess), NUNCA em meta:
         X-Frame-Options, Permissions-Policy e afins são ignorados por spec
         quando vêm em http-equiv — as tags que existiam aqui eram decorativas. -->

    <!-- ── Icons ── -->
    <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
    <link rel="apple-touch-icon" href="/brand-mark.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ── Canonical & Open Graph ── -->
    <link rel="canonical" href="https://despertarespiral.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://despertarespiral.com" />
    <meta property="og:site_name" content="Despertar Espiral" />
    <meta property="og:title" content="Despertar Espiral — Mulher Espiral · Método de Reconexão e Cura" />
    <meta property="og:description" content="Conduza seu reencontro com a essência através de um caminho de autoconhecimento profundo, estruturado e amoroso." />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://despertarespiral.com/og-image.jpg" />

    <!-- ── Fonts — preconnect first, then load ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&family=Montserrat:wght@400;500;600&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- ── Structured Data ──
         SÓ WebSite, de propósito. O Course "Mulher Espiral" R$997 que vivia
         aqui anunciava um preço que a página não exibe (o catálogo real mudou —
         a entrada é outra) e a SearchAction apontava para /community, rota
         atrás de login: markup não representativo viola a diretriz do Google e
         convida o robô a uma porta trancada. Quando um produto tiver preço
         VISÍVEL na landing, o Product/Offer volta — do catálogo, não de literal. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Despertar Espiral",
      "url": "https://despertarespiral.com",
      "description": "Método de Reconexão e Cura feminina por Sunyan Nunes",
      "inLanguage": "pt-BR"
    }
    </script>

    <!-- ── Critical CSS — prevent FOUC ── -->
    <style>
      :root { color-scheme: dark; }
      html { background: #070915; }
      body { margin: 0; background: #070915; }
    </style>
  </head>
  <body>
    <div id="root"></div>

          <p style="line-height:1.6;color:#cfc7b8;margin:0;">A área interativa do site precisa de JavaScript — habilite-o no navegador para conhecer o método e entrar na jornada.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
